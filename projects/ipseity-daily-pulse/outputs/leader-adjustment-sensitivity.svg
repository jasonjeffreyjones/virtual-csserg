<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">Leader slopes before and after adjustment</title>
  <desc id="desc">Dumbbell plot comparing unadjusted and composition-and-calendar-adjusted annual prevalence slopes for the five most positive and five most negative unadjusted leaders. Adjusted estimates include clustered 95 percent intervals.</desc>
