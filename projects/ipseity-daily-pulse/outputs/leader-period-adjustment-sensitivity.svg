<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="680" viewBox="0 0 1050 680" role="img" aria-labelledby="title desc">
  <title id="title">Raw and adjusted concentration of four-period change</title>
  <desc id="desc">Dumbbell plot for ten displayed signifiers comparing the largest adjacent transition&#x27;s share of total absolute four-period movement before and after age, observed-composition, weekday, and month standardization. Labels identify the largest raw and adjusted transitions; ochre adjusted points mark a changed transition.</desc>
  <rect width="1050" height="680" fill="#ffffff"/>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #243128; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4e5d51; }
    .axis { stroke: #66736a; stroke-width: 1; }
    .grid { stroke: #dde3d8; stroke-width: 1; }
    .tick { font-size: 13px; fill: #4e5d51; }
  </style>
  <text class="title" x="235" y="38">Is the largest short-period move composition-sensitive?</text>
  <text class="subtitle" x="235" y="66">Largest transition share of each selected leader's total absolute four-period path</text>
  <circle cx="235" cy="92" r="5" fill="#ffffff" stroke="#66736a" stroke-width="2"/>
  <text class="tick" x="247" y="97">Raw</text>
  <circle cx="305" cy="92" r="5" fill="#4B6F44"/>
  <text class="tick" x="317" y="97">Adjusted to a common observed covariate mix</text>
  <line class="grid" x1="235.0" y1="125" x2="235.0" y2="608"/>
  <text class="tick" text-anchor="middle" x="235.0" y="634">0%</text>
  <line class="grid" x1="387.5" y1="125" x2="387.5" y2="608"/>
  <text class="tick" text-anchor="middle" x="387.5" y="634">25%</text>
  <line class="grid" x1="540.0" y1="125" x2="540.0" y2="608"/>
  <text class="tick" text-anchor="middle" x="540.0" y="634">50%</text>
  <line class="grid" x1="692.5" y1="125" x2="692.5" y2="608"/>
  <text class="tick" text-anchor="middle" x="692.5" y="634">75%</text>
  <line class="grid" x1="845.0" y1="125" x2="845.0" y2="608"/>
  <text class="tick" text-anchor="middle" x="845.0" y="634">100%</text>
  <text class="tick" text-anchor="end" x="223" y="154.2">beautiful</text>
  <line x1="556.4" y1="149.2" x2="565.4" y2="149.2" stroke="#aeb9b0" stroke-width="3"/>
  <circle cx="556.4" cy="149.2" r="5" fill="#ffffff" stroke="#66736a" stroke-width="2"/>
  <circle cx="565.4" cy="149.2" r="5" fill="#4B6F44"/>
