<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">Pooled and within-respondent leader slopes</title>
  <desc id="desc">Dumbbell plot comparing pooled and respondent-fixed-effect annual prevalence slopes for the five most positive and five most negative pooled leaders. Within-respondent estimates use repeat respondents and include respondent-clustered 95 percent intervals where at least one repeat respondent changed endorsement.</desc>
