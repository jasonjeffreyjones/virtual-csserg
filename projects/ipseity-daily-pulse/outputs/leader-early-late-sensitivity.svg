<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">Two-period contrasts before and after adjustment</title>
  <desc id="desc">Dumbbell plot comparing raw and composition-and-calendar-adjusted late-half minus early-half prevalence contrasts for the five most positive and five most negative linear-trend leaders. Adjusted estimates include respondent-clustered 95 percent intervals. Green adjusted contrasts match the selected linear slope&#x27;s direction; ochre contrasts do not.</desc>
