  <circle cx="664.9" cy="487.2" r="5" fill="#ffffff" stroke="#66736a" stroke-width="2"/>
  <circle cx="554.1" cy="487.2" r="5" fill="#9B6A21"/>
  <text class="tick" x="861" y="492.2">P3→P4 → P1→P2</text>
