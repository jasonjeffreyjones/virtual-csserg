<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">Late-half versus early-half prevalence</title>
  <desc id="desc">Point and interval plot of late-half minus early-half endorsement prevalence for the five most positive and five most negative linear-trend leaders. Green contrasts match the direction of the selected linear slope; ochre contrasts do not.</desc>
  <rect width="960" height="660" fill="#ffffff"/>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #243128; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4e5d51; }
    .axis { stroke: #66736a; stroke-width: 1; }
    .grid { stroke: #dde3d8; stroke-width: 1; }
    .tick { font-size: 13px; fill: #4e5d51; }
  </style>
  <text class="title" x="235" y="38">Late-half versus early-half prevalence</text>
  <text class="subtitle" x="235" y="66">Early ≤ 2026-02-12 · late ≥ 2026-02-13 · selected leaders</text>
  <circle cx="235" cy="90" r="5" fill="#4B6F44"/>
  <text class="tick" x="247" y="95">Late minus early; line is respondent-clustered 95% interval</text>
