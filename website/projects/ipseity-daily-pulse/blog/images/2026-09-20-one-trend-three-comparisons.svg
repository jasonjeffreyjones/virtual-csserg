<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">Three views of selected leader slopes</title>
  <desc id="desc">Plot comparing all-response pooled, repeat-sample pooled, and respondent-fixed-effect annual prevalence slopes for the five most positive and five most negative all-response leaders. Repeat-sample and within-person estimates use the same observations. Within-person estimates include respondent-clustered 95 percent intervals where at least one repeat respondent changed endorsement.</desc>
